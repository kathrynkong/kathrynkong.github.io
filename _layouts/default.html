<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">

{% seo %}
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link rel="preload" href="https://fonts.googleapis.com/css?family=Open+Sans:400,700&display=swap" as="style" type="text/css" crossorigin>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#4338ca">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}
  </head>
  <body>
    <a id="skip-to-content" href="#content">Skip to the content.</a>

    <header class="page-header" role="banner">
      <button type="button" class="paw-easter-egg" aria-label="A little secret">🐾</button>
      <div class="paw-easter-egg-message" role="status" aria-live="polite"></div>
      <h1 class="project-name flow-text hero-fade" style="animation-delay: 0s">{{ site.title }}</h1>
      <h2 class="project-tagline hero-fade" style="animation-delay: 0.2s">{{ site.description }}</h2>
      <nav class="site-nav hero-fade" aria-label="Primary" style="animation-delay: 0.4s">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>Home</a>
        <a href="{{ '/portfolio/' | relative_url }}"{% if page.url contains '/portfolio/' %} class="active"{% endif %}>Portfolio</a>
        <a href="{{ '/research/' | relative_url }}"{% if page.url contains '/research/' %} class="active"{% endif %}>Research</a>
        <a href="{{ '/teaching/' | relative_url }}"{% if page.url contains '/teaching/' %} class="active"{% endif %}>Teaching</a>
        <a href="{{ '/cv/' | relative_url }}"{% if page.url contains '/cv/' %} class="active"{% endif %}>CV</a>
        <a href="{{ '/about/' | relative_url }}"{% if page.url contains '/about/' %} class="active"{% endif %}>About</a>
      </nav>
    </header>

    <main id="content" class="main-content" role="main">
      {{ content }}

      <footer class="site-footer">
        <span class="site-footer-credits">This page was generated by <a href="https://pages.github.com">GitHub Pages</a>.</span>
      </footer>
    </main>

    <script src="{{ '/assets/js/flow-text.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/interactions.js' | relative_url }}" defer></script>
  </body>
</html>
